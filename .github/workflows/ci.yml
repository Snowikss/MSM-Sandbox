name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app

      - name: Import application
        run: python -c "from app.main import app; assert app.title == 'MSM Sandbox'"

      - name: Bridge and NPS compatibility smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8123 > /tmp/msm-sandbox.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/msm-sandbox.log' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/api/health >/dev/null; then
              break
            fi
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:8123/api/health | grep -q 'ok'
          curl -fsS -X POST http://127.0.0.1:8123/auth/api/token | grep -q 'sandbox-local-token'
          curl -fsS -X POST http://127.0.0.1:8123/auth/api/token | grep -q 'websocketPort'
          curl -fsS -X POST http://127.0.0.1:8123/pregame_setup.php | grep -q '8282'
          curl -fsS http://127.0.0.1:8123/api/compat/nps | grep -q 'nps-custom-server'
          curl -fsS http://127.0.0.1:8123/content/files.json | grep -q '\[\]'
          curl -fsS http://127.0.0.1:8123/content/downloads.xml | grep -q '<Downloads'
          curl -fsS http://127.0.0.1:8123/msm/socket | grep -q 'apiOK'

          python - <<'PY'
          import asyncio
          import json
          import websockets

          from app.sfs_codec import build_client_frame, parse_server_frame

          async def diagnostic_test():
              async with websockets.connect('ws://127.0.0.1:8123/msm/socket?diagnostic=1') as ws:
                  hello = json.loads(await ws.recv())
                  assert hello['type'] == 'server_hello'
                  await ws.send(json.dumps({'command': 'playerSync'}))
                  reply = json.loads(await ws.recv())
                  assert reply['type'] == 'playerSync'
                  assert reply['player']['active_island']['name'] == 'Plant Island'

          async def binary_test(path):
              async with websockets.connect(f'ws://127.0.0.1:8123{path}') as ws:
                  await ws.send(build_client_frame(1, 'USER_LOGIN', {'user_game_id': 'ci-player'}))
                  raw = await asyncio.wait_for(ws.recv(), timeout=2)
                  assert isinstance(raw, bytes)
                  frame = parse_server_frame(raw)
                  assert frame.command == 'USER_LOGIN'
                  assert frame.payload['success'] is True
                  assert frame.payload['user'] == 'ci-player'

                  await ws.send(build_client_frame(2, 'gs_player', {}))
                  raw = await asyncio.wait_for(ws.recv(), timeout=2)
                  frame = parse_server_frame(raw)
                  assert frame.command == 'gs_player'
                  assert frame.payload['player_object']['display_name'] == 'Test'

          async def main():
              await diagnostic_test()
              await binary_test('/msm/socket')
              await binary_test('/websocket')
              await binary_test('/BlueBox/BlueBox.do')

          asyncio.run(main())
          PY

      - name: Multi-port launcher smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m app.run > /tmp/msm-multiport.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; cat /tmp/msm-multiport.log' EXIT

          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:5050/api/compat/nps >/dev/null \
              && curl -fsS http://127.0.0.1:8282/msm/socket >/dev/null; then
              break
            fi
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:8000/api/health | grep -q 'ok'
          curl -fsS http://127.0.0.1:5050/api/compat/nps | grep -q 'nps-custom-server'
          curl -fsS -X POST http://127.0.0.1:5050/pregame_setup.php | grep -q '8282'
          curl -fsS http://127.0.0.1:8282/msm/socket | grep -q 'apiOK'

          python - <<'PY'
          import asyncio
          import websockets
          from app.sfs_codec import build_client_frame, parse_server_frame

          async def main():
              async with websockets.connect('ws://127.0.0.1:8282/msm/socket') as ws:
                  await ws.send(build_client_frame(1, 'USER_LOGIN', {'user_game_id': 'multiport-ci'}))
                  raw = await asyncio.wait_for(ws.recv(), timeout=2)
                  frame = parse_server_frame(raw)
                  assert frame.command == 'USER_LOGIN'
                  assert frame.payload['success'] is True

          asyncio.run(main())
          PY
